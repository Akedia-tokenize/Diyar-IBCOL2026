name: Assemble final financial whitepaper PDF
on:
  push:
    branches:
      - work/financial-annex-final-pdf-2026-11-10
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: python -m pip install --quiet pymupdf reportlab openpyxl
      - name: Inspect original PDF structure
        run: python tools/finance/page_map.py
      - name: Assemble when builder is present
        run: |
          if [ -f tools/finance/build_final.py ]; then
            python tools/finance/build_final.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/DIYAR_IBCOL2026_Whitepaper_v2.7_with_Annex_D9_FULL.pdf paper/DIYAR_IBCOL2026_Annexes_A-H_with_D9.pdf tools/finance/qa_preview_D9_page1.png tools/finance/qa_preview_D9_page2.png
            git diff --cached --check
            git commit -m "build: publish complete whitepaper and annex PDF with integrated financial addendum"
            git push origin HEAD:work/financial-annex-final-pdf-2026-11-10
          fi
